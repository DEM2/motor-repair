# ─────────────────────────────────────────────────────────────────────
# Orquestación local de toda la plataforma.
#
#   1) cp .env.example .env
#   2) node scripts/generate-keys.mjs
#   3) docker compose up -d --build
#
#   Frontend:          http://localhost:5173
#   Auth API (docs):   http://localhost:4000/docs
#   Business API docs: http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: motor-repair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Variables que usa infra/postgres/init/01-create-databases.sh
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      BUSINESS_DB_NAME: ${BUSINESS_DB_NAME}
      BUSINESS_DB_USER: ${BUSINESS_DB_USER}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD}
    # No se publica el puerto en el equipo anfitrión: los servicios se conectan por la red
    # interna de Docker (host "postgres"). Así no hay conflicto con otro PostgreSQL local.
    # Para conectarse con DBeaver/pgAdmin o correr las pruebas locales, descomente:
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    image: motor-repair/auth-service:local
    container_name: motor-repair-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      # La llave PRIVADA solo se monta en este contenedor (Docker secret).
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BCRYPT_SALT_ROUNDS: 12
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FULL_NAME: Administrador del taller
    secrets:
      - jwt_private_key
    ports:
      - "${AUTH_PORT:-4000}:4000"

  business-service:
    build: ./business-service
    image: motor-repair/business-service:local
    container_name: motor-repair-business
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${BUSINESS_DB_USER}:${BUSINESS_DB_PASSWORD}@postgres:5432/${BUSINESS_DB_NAME}
      # Solo la llave PÚBLICA: puede verificar tokens, nunca emitirlos.
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    secrets:
      - jwt_public_key
    ports:
      - "${BUSINESS_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # URLs vistas desde el navegador del usuario (no desde la red interna de Docker).
        VITE_AUTH_API_URL: http://localhost:${AUTH_PORT:-4000}
        VITE_BUSINESS_API_URL: http://localhost:${BUSINESS_PORT:-8000}
    image: motor-repair/frontend:local
    container_name: motor-repair-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - business-service
    ports:
      - "${FRONTEND_PORT:-5173}:80"

secrets:
  jwt_private_key:
    file: ./keys/jwt_private.pem
  jwt_public_key:
    file: ./keys/jwt_public.pem

volumes:
  pgdata: