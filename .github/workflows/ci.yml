# ─────────────────────────────────────────────────────────────────────
# Pipeline de integración y despliegue continuo.
#
#  Pull request a main / push a main o feature/*:
#    1. auth-service      → lint + typecheck + build + pruebas (con PostgreSQL)
#    2. business-service  → ruff + pruebas (con PostgreSQL, ejecuta migraciones)
#    3. frontend          → lint + typecheck + pruebas + build
#    4. e2e               → levanta TODO con Docker Compose (entorno de pruebas
#                           efímero) y ejecuta la prueba de humo entre servicios
#  Solo en push a main (tras pasar todo lo anterior):
#    5. publish           → construye y publica las imágenes en GitHub Container Registry
# ─────────────────────────────────────────────────────────────────────
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

# Cancela ejecuciones anteriores de la misma rama si llega un commit nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-service:
    name: Auth service (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth-service/package*.json
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint (ESLint)
        run: npm run lint
      - name: Validación estática de tipos (tsc)
        run: npm run typecheck
      - name: Compilación
        run: npm run build
      - name: Pruebas automatizadas (Jest + Supertest)
        run: npm run test:coverage
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: auth_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

  business-service:
    name: Business service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: business_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: business-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análisis estático (ruff)
        run: ruff check .
      - name: Pruebas automatizadas (pytest)
        run: pytest -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/business_test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package*.json
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Lint (ESLint)
        run: npm run lint
      - name: Validación estática de tipos (tsc)
        run: npm run typecheck
      - name: Pruebas automatizadas (Vitest + Testing Library)
        run: npm test
      - name: Compilación de producción
        run: npx vite build

  e2e:
    name: Despliegue en entorno de pruebas + smoke test
    runs-on: ubuntu-latest
    needs: [auth-service, business-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar configuración efímera (sin secretos reales)
        run: |
          cp .env.example .env
          node scripts/generate-keys.mjs
          # Los contenedores corren con usuarios sin privilegios: se permite leer la llave
          # generada solo para este entorno desechable.
          chmod 644 keys/jwt_private.pem
      - name: Construir y levantar la plataforma
        run: docker compose up -d --build --wait
      - name: Prueba de humo entre servicios
        run: node scripts/smoke-test.mjs
      - name: Logs de los servicios (si algo falla)
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar el entorno
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imágenes (GHCR)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, business-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalizar el nombre del repositorio (GHCR exige minúsculas)
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
